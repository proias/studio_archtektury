<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Kontakt — definicja formularza</title>
  </head>
  <body>
    <!-- Static form definition for Netlify detection and AJAX submissions. -->
    <form
      name="kontakt-pracownia"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="kontakt-pracownia" />
      <input name="name" type="text" required />
      <input name="email" type="email" required />
      <input name="phone" type="tel" />
      <input name="projectType" type="text" required />
      <textarea name="message" required></textarea>
      <input name="bot-field" type="text" />
    </form>
  </body>
</html>
